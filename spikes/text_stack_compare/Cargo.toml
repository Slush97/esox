[package]
name = "esox-text-stack-compare"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "fontconfig"] }
parley = { version = "=0.11.0", features = ["accesskit", "complex-scripts"] }
rustybuzz = "=0.20.1"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
